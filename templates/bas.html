<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.3/slate/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
<div class="container"></div>
<div class="d-flex flex-column flex-md-row align-items-center py-3 mb-4 border-bottom">
    <a href="/posts" class="d-flex align-items-center link-body-emphasis text-decoration-none">
        <img src="{{ url_for('static', filename='/Logo.png') }}" width="40" height="50" class="me-2">
        <span class="fs-4 text-white fw-bold">TemForm</span>
    </a>

   <nav class="d-inline-flex ms-md-auto me-3 align-items-center">
    <a class="me-3 text-decoration-none nav-link-custom" href="/posts">Home</a>
    <a class="me-3 text-decoration-none nav-link-custom" href="/about">About us</a>
    {% if current_viewer %}
        <a class="me-3 text-decoration-none nav-link-custom" href="/account">Account</a>
        <a class="me-3 text-decoration-none nav-link-custom" href="/logout">Sign out</a>
    {% else %}
        <a class="me-3 text-decoration-none nav-link-custom" href="/signup">Sign up</a>
        <a class="me-3 text-decoration-none nav-link-custom" href="/avtor">Sign in</a>
    {% endif %}
</nav>

    <a class="btn btn-outline-info rounded-pill px-3 fw-bold" href="/create-article">Create</a>
</div>
<style>
    .nav-link-custom {
        color: #aaa !important; /* Спокойный серый цвет в дефолте */
        transition: color 0.2s ease-in-out;
    }
    .nav-link-custom:hover {
        color: #fff !important; /* Яркий белый при наведении */
    }
</style>
</div>
{% block body %}{% endblock %}
</body>
</html>
