{% extends 'bas.html' %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg border-secondary p-4" style="width: 100%; max-width: 400px; background-color: #212529 !important;">

        <h3 class="text-white fw-bold text-center mb-4">Sign up</h3>

        <form action="/signup" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" class="form-control bg-dark text-white border-secondary rounded-3 py-2 px-3 custom-input"
                       name="username" placeholder="Придумайте имя пользователя" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small">Password</label>
                <input type="password" class="form-control bg-dark text-white border-secondary rounded-3 py-2 px-3 custom-input"
                       name="password" placeholder="Придумайте пароль" required>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small">Email</label>
                <input type="email" class="form-control bg-dark text-white border-secondary rounded-3 py-2 px-3 custom-input"
                       name="email" placeholder="Введите ваш email" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-info rounded-pill fw-bold py-2 shadow-sm">
                    Зарегистрироваться
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Уже есть аккаунт?</span>
            <a href="/avtor" class="small text-info text-decoration-none ms-1 fw-bold">Sign in</a>
        </div>

    </div>
</div>

<style>
    .custom-input::placeholder {
        color: #6c757d !important;
    }
    .custom-input:focus {
        background-color: #15171c !important;
        color: #fff !important;
        border-color: #5bc0de !important;
        box-shadow: 0 0 0 0.25rem rgba(91, 192, 222, 0.25) !important;
    }
</style>
{% endblock %}
